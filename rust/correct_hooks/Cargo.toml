[package]
name = "correct_hooks"
version = "0.1.0"
edition = "2024"

[dependencies]
async-backtrace = "0.2.7"
axum = "0.8.9"
axum-server = "0.8.0"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["http2", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.1"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
